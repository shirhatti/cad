name: CI

on:
  # Validate every branch push (including feature branches) and every PR.
  push:
  pull_request:

# Cancel superseded runs on the same ref so rapid pushes don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve the CI container image for this commit's toolchain.toml +
  # ci/Dockerfile, building and pushing it only if that tag doesn't exist yet.
  # Building also mirrors the pinned AppImages to GHCR on first fetch.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "latest"
        enable-cache: true

    - name: Compute image ref
      id: ref
      run: echo "ref=$(uv run scad-tools toolchain image-ref)" >> "$GITHUB_OUTPUT"

    # Every run, so a failed or missed mirror push is retried; a no-op (one
    # registry request per tool) once the mirror is current.
    - name: Mirror pinned toolchain to GHCR
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: uv run scad-tools toolchain mirror

    - name: Build and push image if missing
      env:
        REF: ${{ steps.ref.outputs.ref }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        if docker manifest inspect "$REF" > /dev/null 2>&1; then
          echo "Using existing $REF"
          exit 0
        fi
        context="$RUNNER_TEMP/ci-image"
        uv run scad-tools toolchain install --prefix "$context/toolchain"
        docker build -t "$REF" -f ci/Dockerfile "$context"
        docker push "$REF"

  validate:
    needs: image
    runs-on: ubuntu-latest
    # Pinned OpenSCAD + OrcaSlicer and their runtime libs; everything below
    # runs headless with no display, Xvfb, or apt installs.
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: write
      pull-requests: write  # print-metrics comment
    env:
      UV_CACHE_DIR: /tmp/uv-cache

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Cache uv
      uses: actions/cache@v6
      with:
        path: /tmp/uv-cache
        key: uv-${{ hashFiles('uv.lock') }}

    - name: Sync Python dependencies
      run: uv sync

    # Slicing only needs resources/profiles from the OrcaSlicer submodule;
    # this fetches just that subtree at the pinned commit (blobless + sparse)
    # instead of checking out the whole OrcaSlicer source tree.
    - name: Fetch OrcaSlicer profiles
      run: |
        # The workspace is owned by the runner user, not the container's root
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        uv run scad-tools profiles fetch

    - name: Test scad-tools CLI
      run: uv run pytest -q

    - name: Lint OpenSCAD files
      run: uv run scad-tools lint

    - name: Lint slicer profiles
      run: uv run scad-tools profiles lint

    - name: Run OpenSCAD unit tests
      run: uv run scad-tools test

    - name: Validate models render
      run: uv run scad-tools check

    - name: Render models
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
      run: uv run scad-tools render

    - name: Check meshes
      run: uv run scad-tools mesh

    - name: Slice models
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
      run: uv run scad-tools slice

    # The diff a PR makes to each model's print time, filament, supports, ...
    # against the base branch's committed print-metrics.json; on pushes,
    # against this commit's own snapshot (i.e. what's not yet committed).
    - name: Print-metrics report
      if: ${{ !cancelled() }}
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [ -n "$BASE_REF" ] && git fetch -q --depth 1 origin "$BASE_REF"; then
          git show FETCH_HEAD:print-metrics.json > "$RUNNER_TEMP/base-metrics.json" 2>/dev/null || true
          title="Print metrics vs $BASE_REF"
        else
          cp print-metrics.json "$RUNNER_TEMP/base-metrics.json" 2>/dev/null || true
          title="Print metrics vs committed snapshot"
        fi
        uv run scad-tools metrics diff "$RUNNER_TEMP/base-metrics.json" --title "$title" > print-metrics-report.md
        cat print-metrics-report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Comment print metrics on PR
      if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('print-metrics-report.md') != '' }}
      # Fork PRs get a read-only token; the job summary still has the report
      continue-on-error: true
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- print-metrics -->';
          const body = `${marker}\n${fs.readFileSync('print-metrics-report.md', 'utf8')}`;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const mine = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
          if (mine) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Check print-metrics.json is up to date
      run: uv run scad-tools metrics check

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: build-artifacts
        path: |
          artifacts/stl/*.stl
          artifacts/preview/*.png
          artifacts/gcode/*.3mf
          artifacts/logs/*.log
          artifacts/metrics/*.json
          artifacts/profiles/**/*.json
        retention-days: 7
