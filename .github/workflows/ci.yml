name: CI

on:
  # Validate every branch push (including feature branches) and every PR.
  push:
  pull_request:

# Cancel superseded runs on the same ref so rapid pushes don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    # Slicing only needs resources/profiles from the OrcaSlicer submodule.
    # Fetch just that subtree at the pinned commit (blobless + sparse) instead
    # of checking out the whole OrcaSlicer source tree.
    - name: Fetch OrcaSlicer profiles
      run: |
        sha=$(git ls-tree HEAD .orca-slicer | awk '{print $3}')
        git init -q .orca-slicer
        cd .orca-slicer
        git remote add origin https://github.com/OrcaSlicer/OrcaSlicer.git
        git sparse-checkout set resources/profiles
        git fetch -q --depth 1 --filter=blob:none origin "$sha"
        git checkout -q FETCH_HEAD

    # Plain apt install with a fresh index. The cache action swallowed 404s
    # from a stale mirror index and cached an empty package set, leaving
    # OpenSCAD silently missing.
    - name: Install APT packages
      run: |
        sudo apt-get update
        sudo apt-get install -y openscad xvfb gstreamer1.0-plugins-base libwebkit2gtk-4.1-0 libwebkitgtk-6.0-4 libjavascriptcoregtk-6.0-1
        openscad --version

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"
        enable-cache: true

    - name: Install OrcaSlicer
      run: |
        wget -q "https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.3.1/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.3.1.AppImage" -O OrcaSlicer.AppImage
        chmod +x OrcaSlicer.AppImage
        ./OrcaSlicer.AppImage --appimage-extract >/dev/null 2>&1
        sudo rm -rf /opt/orcaslicer
        sudo mv squashfs-root /opt/orcaslicer
        sudo ln -sf /opt/orcaslicer/AppRun /usr/local/bin/orca-slicer

    - name: Sync Python dependencies
      run: uv sync

    - name: Lint OpenSCAD files
      run: uv run scad-tools lint

    - name: Run OpenSCAD unit tests
      run: uv run scad-tools test

    - name: Validate models render
      run: uv run scad-tools check

    - name: Render models
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
      run: uv run scad-tools render

    - name: Slice models
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
      run: uv run scad-tools slice

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-artifacts
        path: |
          artifacts/stl/*.stl
          artifacts/preview/*.png
          artifacts/gcode/*.3mf
          artifacts/logs/*.log
        retention-days: 7
