name: CI

on:
  # Validate every branch push (including feature branches) and every PR.
  push:
  pull_request:

# Cancel superseded runs on the same ref so rapid pushes don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve the CI container image for this commit's toolchain.toml +
  # ci/Dockerfile, building and pushing it only if that tag doesn't exist yet.
  # Building also mirrors the pinned AppImages to GHCR on first fetch.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "latest"
        enable-cache: true

    - name: Compute image ref
      id: ref
      run: echo "ref=$(uv run scad-tools toolchain image-ref)" >> "$GITHUB_OUTPUT"

    # Every run, so a failed or missed mirror push is retried; a no-op (one
    # registry request per tool) once the mirror is current.
    - name: Mirror pinned toolchain to GHCR
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: uv run scad-tools toolchain mirror

    - name: Build and push image if missing
      env:
        REF: ${{ steps.ref.outputs.ref }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        if docker manifest inspect "$REF" > /dev/null 2>&1; then
          echo "Using existing $REF"
          exit 0
        fi
        context="$RUNNER_TEMP/ci-image"
        uv run scad-tools toolchain install --prefix "$context/toolchain"
        docker build -t "$REF" -f ci/Dockerfile "$context"
        docker push "$REF"

  validate:
    needs: image
    runs-on: ubuntu-latest
    # Pinned OpenSCAD + OrcaSlicer and their runtime libs; everything below
    # runs headless with no display, Xvfb, or apt installs.
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: write
    env:
      UV_CACHE_DIR: /tmp/uv-cache

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    # Slicing only needs resources/profiles from the OrcaSlicer submodule.
    # Fetch just that subtree at the pinned commit (blobless + sparse) instead
    # of checking out the whole OrcaSlicer source tree.
    - name: Fetch OrcaSlicer profiles
      run: |
        # The workspace is owned by the runner user, not the container's root
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        sha=$(git ls-tree HEAD .orca-slicer | awk '{print $3}')
        git init -q .orca-slicer
        cd .orca-slicer
        git remote add origin https://github.com/OrcaSlicer/OrcaSlicer.git
        git sparse-checkout set resources/profiles
        git fetch -q --depth 1 --filter=blob:none origin "$sha"
        git checkout -q FETCH_HEAD

    - name: Cache uv
      uses: actions/cache@v6
      with:
        path: /tmp/uv-cache
        key: uv-${{ hashFiles('uv.lock') }}

    - name: Sync Python dependencies
      run: uv sync

    - name: Test scad-tools CLI
      run: uv run pytest -q

    - name: Lint OpenSCAD files
      run: uv run scad-tools lint

    - name: Run OpenSCAD unit tests
      run: uv run scad-tools test

    - name: Validate models render
      run: uv run scad-tools check

    - name: Render models
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
      run: uv run scad-tools render

    - name: Slice models
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
      run: uv run scad-tools slice

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: build-artifacts
        path: |
          artifacts/stl/*.stl
          artifacts/preview/*.png
          artifacts/gcode/*.3mf
          artifacts/logs/*.log
        retention-days: 7
