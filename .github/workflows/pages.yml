name: Deploy Gallery to Pages

on:
  # Run after CI finishes on main so the GHCR render cache is already warm.
  # This avoids racing CI for the same cache (both would otherwise start cold
  # and render everything twice); here Pages gets cache hits instead.
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages and read render cache from GHCR
permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let a newer run cancel an in-flight one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # CI (which this follows) has already built the image for this commit
  image:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"
        enable-cache: true

    - name: Compute image ref
      id: ref
      run: echo "ref=$(uv run scad-tools toolchain image-ref)" >> "$GITHUB_OUTPUT"

  build:
    needs: image
    runs-on: ubuntu-latest
    # Same headless toolchain image as CI, so renders hit CI's cache keys
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Sync Python dependencies
      run: uv sync

    - name: Render models
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REF_NAME: main
      run: uv run scad-tools render

    - name: Build gallery site
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REF_NAME: main
      run: uv run scad-tools gallery

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      continue-on-error: true

    # GitHub's Pages backend intermittently rejects an otherwise-valid
    # deployment with "Deployment failed, try again later." (See run
    # 28716679590 — the deploys immediately before and after succeeded.)
    # Retry once so a single transient backend hiccup doesn't fail the run.
    - name: Retry deploy to GitHub Pages
      if: steps.deployment.outcome == 'failure'
      id: deployment-retry
      uses: actions/deploy-pages@v4
