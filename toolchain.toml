# Pinned CLI toolchain (Linux x86_64 AppImages).
#
# `scad-tools toolchain install` fetches these from the GHCR mirror (falling
# back to upstream), verifies the sha256, and extracts them, so neither needs
# FUSE or a display. CI bakes them into its container image (ci/Dockerfile),
# and the image tag is a hash of this file + the Dockerfile, so editing a pin
# here rebuilds the image. Upstream snapshot builds are not kept forever,
# which is why each pin is also mirrored to GHCR the first time CI fetches it.

# OCI repository prefix for the mirrored AppImages and the CI image
mirror = "ghcr.io/shirhatti/cad"

[tools.openscad]
version = "2026.10.02"
url = "https://files.openscad.org/snapshots/OpenSCAD-2026.10.02-x86_64.AppImage"
sha256 = "4d81b816058ee7a60128b7fd25f13ac642e8adc68490140d3cb600f3aea26a98"
bin = "openscad"

[tools.orcaslicer]
version = "2.3.1"
url = "https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.3.1/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.3.1.AppImage"
sha256 = "f199e5408914efdbbbfa4fd6752cd6ad4727209b488bc47bff9a0da5f053a701"
bin = "orca-slicer"
