# Pre-commit hooks for CAD project
# See https://pre-commit.com for more information

repos:
  # Local hooks
  - repo: local
    hooks:
      - id: customizer-lint
        name: MakerBot Customizer Linter
        description: Validate OpenSCAD syntax and MakerBot Customizer compliance
        entry: uv run python -m scripts.customizer_lint
        language: system
        files: \.scad$
        types: [file]
        pass_filenames: true

      - id: openscad-tests
        name: OpenSCAD Unit Tests
        description: Run OpenSCAD unit tests (*_test.scad files)
        entry: uv run scad-tools test
        language: system
        files: \.scad$
        pass_filenames: false

      - id: slicer-profiles-lint
        name: Slicer Profile Lint
        description: Check local OrcaSlicer overrides resolve and change something
        entry: uv run scad-tools profiles lint
        language: system
        files: ^\.orca-profiles-local/.*\.json$
        pass_filenames: false

      - id: scad-tools-pytest
        name: scad-tools Python Tests
        description: Run the pytest suite for the scad-tools CLI (tests/)
        entry: uv run pytest -q
        language: system
        files: ^(scripts|tests)/.*\.py$
        pass_filenames: false
